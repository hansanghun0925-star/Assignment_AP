<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>60대 타깃 창업 상권 리포트</title>
<script src="//dapi.kakao.com/v2/maps/sdk.js?appkey=04bbfbccc6c79ca90c280045769fae04&libraries=services"></script>
<style>
/* ═══════════════════════════════════════════════
   RESET & TOKENS   (ANALIF 토큰 유지)
═══════════════════════════════════════════════ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  /* surface */
  --bg:#0b0f17;
  --s1:#111827;   /* panel bg */
  --s2:#1a2235;   /* card bg */
  --s3:#243046;   /* hover */
  --border:#2d3d55;
  --border2:#3d5070;
  /* text */
  --t1:#f0f4ff;
  --t2:#94a3b8;
  --t3:#60748f;
  /* accent */
  --or:#f97316;   /* 추천 · 주황 */
  --bl:#3b82f6;   /* 보조 · 파랑 */
  --gr:#22c55e;   /* 좋음 */
  --rd:#ef4444;   /* 회피 · 나쁨 */
  --yl:#eab308;   /* 경고 */
  /* layout */
  --pw:360px;
  --hh:56px;
  --R:8px;
}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--t1);
  font-family:'Apple SD Gothic Neo','Pretendard','Noto Sans KR',sans-serif;font-size:13px}
.mono{font-variant-numeric:tabular-nums}

/* ═══════════════════════════════════════════════
   LAYOUT
═══════════════════════════════════════════════ */
#hdr{
  position:fixed;top:0;left:0;right:0;height:var(--hh);
  background:rgba(17,24,39,0.96);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;padding:0 18px;gap:12px;z-index:200}
#panel{
  position:fixed;top:var(--hh);left:0;bottom:0;width:var(--pw);
  background:var(--s1);border-right:1px solid var(--border);
  overflow-y:auto;z-index:100;display:flex;flex-direction:column;
  scrollbar-width:thin;scrollbar-color:var(--border) transparent}
#panel::-webkit-scrollbar{width:8px}
#panel::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
#map-wrap{position:fixed;top:var(--hh);left:var(--pw);right:0;bottom:0}
#map{width:100%;height:100%}

/* ═══════════════════════════════════════════════
   HEADER
═══════════════════════════════════════════════ */
.logo{
  font-size:16px;font-weight:800;letter-spacing:-0.5px;white-space:nowrap;
  background:linear-gradient(135deg,var(--or),var(--bl));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent}
.hdr-divider{width:1px;height:20px;background:var(--border);flex-shrink:0}
.hdr-sub{font-size:11px;color:var(--t3);line-height:1.45;white-space:nowrap}
.hdr-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.tog-grp{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--t2);white-space:nowrap}
.tog{position:relative;display:inline-block;width:30px;height:16px;flex-shrink:0}
.tog input{opacity:0;width:0;height:0}
.tslide{position:absolute;inset:0;background:var(--s3);border-radius:16px;
  transition:.2s;cursor:pointer}
.tslide::before{content:'';position:absolute;width:12px;height:12px;left:2px;top:2px;
  background:var(--t2);border-radius:50%;transition:.2s}
.tog input:checked + .tslide{background:rgba(249,115,22,.35)}
.tog input:checked + .tslide::before{transform:translateX(14px);background:var(--or)}
.tog.blue input:checked + .tslide{background:rgba(239,68,68,.35)}
.tog.blue input:checked + .tslide::before{background:var(--rd)}
#hdr-stat{font-size:11px;color:var(--t3);white-space:nowrap}
#hdr-stat b{color:var(--t1);font-weight:700}

/* ═══════════════════════════════════════════════
   PANEL COMMON
═══════════════════════════════════════════════ */
.psec{
  font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;
  color:var(--t3);padding:12px 14px 6px;border-top:1px solid var(--border)}
.psec:first-child{border-top:none;padding-top:14px}

/* 업종 그리드 */
#cat-wrap{padding:0 14px 10px;display:grid;grid-template-columns:1fr 1fr;gap:4px}
.cat-btn{
  display:flex;align-items:center;gap:6px;padding:6px 8px;
  border:1px solid var(--border);border-radius:6px;cursor:pointer;
  font-size:11px;color:var(--t2);transition:all .15s;user-select:none;background:var(--s2)}
.cat-btn:hover{border-color:var(--border2);color:var(--t1)}
.cat-btn.on{border-color:var(--or);background:rgba(249,115,22,.12);color:var(--t1)}
.cat-btn.all{grid-column:1/-1;justify-content:center;font-weight:600}
.cat-btn.all.on{border-color:var(--bl);background:rgba(59,130,246,.12)}
.cat-dot{width:7px;height:7px;border-radius:50%;background:var(--border2);flex-shrink:0;transition:.15s}
.cat-btn.on .cat-dot{background:var(--or)}
.cat-btn.all.on .cat-dot{background:var(--bl)}

/* 자치구 셀렉트 */
.gu-wrap{padding:0 14px 10px}
.hdr-sel{width:100%;padding:6px 10px;background:var(--s2);border:1px solid var(--border);
  border-radius:6px;color:var(--t1);font-size:11px;font-family:inherit;cursor:pointer}

/* KPI 카드 */
.kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:0 14px 10px}
.kc{background:var(--s2);border:1px solid var(--border);border-radius:var(--R);
  padding:10px;text-align:center}
.kv{font-size:17px;font-weight:700;color:var(--or)}
.kv.rd{color:var(--rd)}
.kl{font-size:9px;color:var(--t3);margin-top:2px}

/* 랭킹 */
.rank-hdr{display:flex;align-items:center;justify-content:space-between;
  padding:12px 14px 6px;border-top:1px solid var(--border)}
.rank-hdr-label{font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--t3)}
.rank-tabs{display:flex;gap:3px}
.rtab{padding:3px 8px;background:var(--s2);border:1px solid var(--border);
  border-radius:4px;font-size:10px;color:var(--t3);cursor:pointer;transition:all .15s}
.rtab.on{background:rgba(249,115,22,.15);border-color:var(--or);color:var(--or);font-weight:600}
.rank-list{display:flex;flex-direction:column;gap:2px;padding:0 14px 10px}
.ri{display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:6px;
  cursor:pointer;transition:all .15s;border:1px solid transparent}
.ri:hover{background:var(--s3);border-color:var(--border)}
.ri.sel{background:var(--s3);border-left:2px solid var(--or)}
.ri.sel.avo{border-left-color:var(--rd)}
.rno{font-size:10px;font-weight:700;color:var(--t3);width:16px;flex-shrink:0;text-align:right}
.rname{flex:1;font-size:11px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rsub{font-size:9px;color:var(--t3)}
.rval{font-size:10px;color:var(--or);white-space:nowrap;flex-shrink:0}
.rval.rd{color:var(--rd)}
.rbadge{font-size:9px;padding:1px 5px;border-radius:10px;background:var(--s3);
  color:var(--t3);white-space:nowrap;flex-shrink:0}

/* 범례 */
.leg-wrap{padding:0 14px 16px;display:flex;flex-direction:column;gap:5px;
  border-top:1px solid var(--border);padding-top:12px}
.lr{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--t2)}
.lsw{width:10px;height:10px;border-radius:50%;border:2px solid rgba(255,255,255,.9);flex-shrink:0}

/* ═══════════════════════════════════════════════
   MARKER
═══════════════════════════════════════════════ */
.mk-wrap{display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;
  transform:translate(-50%,-50%)}
.mk-dot{border-radius:50%;border:2px solid rgba(255,255,255,.92);
  box-shadow:0 2px 8px rgba(0,0,0,.55)}
.mk-name{
  font-size:10px;font-weight:600;color:#fff;
  background:rgba(0,0,0,.75);backdrop-filter:blur(4px);
  border-radius:4px;padding:2px 5px;
  white-space:nowrap;max-width:110px;overflow:hidden;text-overflow:ellipsis;
  pointer-events:none;line-height:1.4;border:1px solid rgba(255,255,255,.08)}

/* ═══════════════════════════════════════════════
   POPUP
═══════════════════════════════════════════════ */
#pop-ov{position:fixed;inset:0;background:rgba(0,0,0,.65);backdrop-filter:blur(4px);
  z-index:400;display:none;align-items:center;justify-content:center}
#pop-ov.open{display:flex}
#pop{background:var(--s1);border:1px solid var(--border);border-radius:12px;
  width:min(880px,96vw);max-height:92vh;overflow-y:auto;
  box-shadow:0 24px 64px rgba(0,0,0,.7);
  scrollbar-width:thin;scrollbar-color:var(--border) transparent}
#pop::-webkit-scrollbar{width:8px}
#pop::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
.pop-hdr{display:flex;justify-content:space-between;align-items:flex-start;
  padding:20px 22px 0;margin-bottom:14px}
.pop-badge{display:inline-block;padding:2px 9px;border-radius:10px;font-size:10px;
  font-weight:700;letter-spacing:.5px;margin-bottom:7px}
.pop-badge.rec{background:rgba(249,115,22,.16);color:var(--or)}
.pop-badge.avo{background:rgba(239,68,68,.16);color:var(--rd)}
.pop-title{font-size:20px;font-weight:800;letter-spacing:-0.3px}
.pop-meta{font-size:11px;color:var(--t3);margin-top:4px;line-height:1.6}
.pop-meta b{color:var(--or);font-weight:600}
.pop-close{background:var(--s2);border:1px solid var(--border);border-radius:6px;
  color:var(--t2);font-size:16px;cursor:pointer;padding:4px 10px;transition:all .15s;flex-shrink:0}
.pop-close:hover{background:var(--s3);color:var(--t1)}
.pop-kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:0 22px 16px}
.pk{background:var(--s2);border:1px solid var(--border);border-radius:var(--R);
  padding:12px 10px;text-align:center}
.pkv{font-size:18px;font-weight:700}
.pkl{font-size:10px;color:var(--t3);margin-top:2px}

.psub{font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;
  color:var(--t3);padding:0 22px;margin-bottom:9px;display:flex;align-items:center;gap:8px}
.psub::after{content:'';flex:1;height:1px;background:var(--border)}
.pblk{padding:0 22px 18px}

/* 근거 리스트 */
.why{background:var(--s2);border:1px solid var(--border);border-radius:var(--R);padding:14px 16px}
.why li{list-style:none;padding-left:18px;position:relative;margin-bottom:9px;
  font-size:12px;line-height:1.65;color:var(--t1)}
.why li:last-child{margin-bottom:0}
.why li::before{content:'';position:absolute;left:0;top:7px;width:5px;height:5px;
  border-radius:50%;background:var(--or)}
.why li b{color:var(--or);font-weight:700}
.why.avo li::before{background:var(--rd)}
.why.avo li b{color:var(--rd)}

/* 매출 비교 바 */
.cmp{margin-bottom:12px}
.cmp:last-child{margin-bottom:0}
.cmp-l{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px}
.cmp-n{font-size:11px;color:var(--t2)}
.cmp-n em{font-style:normal;color:var(--t3);font-size:10px}
.cmp-v{font-size:13px;font-weight:700}
.cmp-b{height:9px;background:var(--s3);border-radius:5px;overflow:hidden}
.cmp-b i{display:block;height:100%;border-radius:5px;transition:width .5s cubic-bezier(.4,0,.2,1)}

.note{margin-top:11px;padding:10px 13px;background:var(--s2);border:1px solid var(--border);
  border-radius:6px;font-size:11px;color:var(--t2);line-height:1.65}
.note b{color:var(--t1)}

/* SHAP */
.shp{margin-bottom:8px}
.shp:last-child{margin-bottom:0}
.shp-t{display:flex;justify-content:space-between;font-size:11px;margin-bottom:3px}
.shp-t span:first-child{color:var(--t2)}
.shp-t span:last-child{font-weight:700;font-size:10.5px}
.shp-b{height:7px;background:var(--s3);border-radius:4px;position:relative;overflow:hidden}
.shp-b i{position:absolute;top:0;height:100%;border-radius:4px}
.shp-b .mid{position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--border2)}

/* 배지 */
.bdg{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:12px;
  font-size:10.5px;font-weight:600;margin:0 5px 5px 0;border:1px solid}
.bdg.ok{background:rgba(34,197,94,.1);color:var(--gr);border-color:rgba(34,197,94,.28)}
.bdg.warn{background:rgba(234,179,8,.1);color:var(--yl);border-color:rgba(234,179,8,.28)}

/* 임대료 — 미작성 영역 */
.blank{border:1.5px dashed var(--border2);border-radius:var(--R);padding:18px;
  text-align:center;background:rgba(36,48,70,.28)}
.blank .bt{font-size:12px;color:var(--t2);font-weight:600;margin-bottom:5px}
.blank .bs{font-size:10.5px;color:var(--t3);line-height:1.6}
.blank .rows{margin-top:14px;display:grid;gap:6px;text-align:left}
.blank .r{display:flex;justify-content:space-between;padding:8px 12px;background:var(--s2);
  border:1px solid var(--border);border-radius:6px;font-size:11px}
.blank .r span:first-child{color:var(--t2)}
.blank .r span:last-child{color:var(--border2);letter-spacing:.15em}
</style>
</head>
<body>

<!-- ════ HEADER ════ -->
<div id="hdr">
  <div class="logo">GGBS</div>
  <div class="hdr-divider"></div>
  <span class="hdr-sub">60대 타깃 창업 상권 리포트 &nbsp;|&nbsp; 자본 1억 · 2026 Q1</span>
  <div class="hdr-right">
    <div class="tog-grp"><span>추천</span>
      <label class="tog"><input type="checkbox" id="tog-rec" checked onchange="render()"><span class="tslide"></span></label></div>
    <div class="tog-grp"><span style="color:#ef4444">회피</span>
      <label class="tog blue"><input type="checkbox" id="tog-avo" checked onchange="render()"><span class="tslide"></span></label></div>
    <div class="tog-grp"><span>상권명</span>
      <label class="tog"><input type="checkbox" id="tog-lbl" checked onchange="render()"><span class="tslide"></span></label></div>
    <div class="hdr-divider"></div>
    <div id="hdr-stat"></div>
  </div>
</div>

<!-- ════ PANEL ════ -->
<div id="panel">
  <div class="psec">업종 선택</div>
  <div id="cat-wrap"></div>

  <div class="psec">자치구</div>
  <div class="gu-wrap"><select id="gu-sel" class="hdr-sel" onchange="render()"></select></div>

  <div class="psec">요약</div>
  <div class="kpi-grid">
    <div class="kc"><div class="kv" id="k-rec">0</div><div class="kl">추천 조합</div></div>
    <div class="kc"><div class="kv rd" id="k-avo">0</div><div class="kl">회피 조합</div></div>
    <div class="kc"><div class="kv" id="k-gap">0</div><div class="kl">평균 미충족 (월)</div></div>
    <div class="kc"><div class="kv" id="k-pct">0</div><div class="kl">평균 분위</div></div>
  </div>

  <div class="rank-hdr">
    <span class="rank-hdr-label" id="rank-label">후보 순위</span>
    <div class="rank-tabs">
      <div class="rtab on" data-sort="z" onclick="setSort('z')">잔차순</div>
      <div class="rtab" data-sort="gap" onclick="setSort('gap')">규모순</div>
    </div>
  </div>
  <div class="rank-list" id="rank-list"></div>

  <div class="leg-wrap">
    <div class="lr"><div class="lsw" style="background:#f97316"></div><span>추천 — 미충족 수요</span></div>
    <div class="lr"><div class="lsw" style="background:#ef4444"></div><span>회피 — 과밀 · 폐업위험</span></div>
    <div class="lr" style="color:#60748f;font-size:10px;margin-top:2px">원 크기 = 미충족 규모</div>
  </div>
</div>

<!-- ════ MAP ════ -->
<div id="map-wrap"><div id="map"></div></div>

<!-- ════ POPUP ════ -->
<div id="pop-ov" onclick="if(event.target===this)closePop()">
  <div id="pop"></div>
</div>

const ALL_BIZ=[...new Set(DATA.map(d=>d.biz))].sort();
const ALL_GU =[...new Set(DATA.map(d=>d.gu))].sort();
let bizOn=new Set(ALL_BIZ);

document.getElementById('cat-wrap').innerHTML =
  `<div class="cat-btn all on" data-cat="all" onclick="toggleCat('all')">
     <div class="cat-dot"></div><span>전체</span></div>` +
  ALL_BIZ.map(b=>`<div class="cat-btn on" data-cat="${b}" onclick="toggleCat('${b}')">
     <div class="cat-dot"></div><span>${b}</span></div>`).join('');
document.getElementById('gu-sel').innerHTML =
  `<option value="all">전체 서울</option>` + ALL_GU.map(g=>`<option>${g}</option>`).join('');

function toggleCat(c){
  if(c==='all') bizOn = bizOn.size===ALL_BIZ.length ? new Set() : new Set(ALL_BIZ);
  else bizOn.has(c) ? bizOn.delete(c) : bizOn.add(c);
  document.querySelectorAll('.cat-btn').forEach(el=>{
    const k=el.dataset.cat;
    el.classList.toggle('on', k==='all' ? bizOn.size===ALL_BIZ.length : bizOn.has(k));
  });
  render();
}
function setSort(k){
  sortKey=k;
  document.querySelectorAll('.rtab').forEach(el=>el.classList.toggle('on',el.dataset.sort===k));
  render();
}

map = new kakao.maps.Map(document.getElementById('map'),
  {center:new kakao.maps.LatLng(37.5533,126.9880), level:8});

function render(){
  const showRec=document.getElementById('tog-rec').checked;
  const showAvo=document.getElementById('tog-avo').checked;
  const showLbl=document.getElementById('tog-lbl').checked;
  const gu=document.getElementById('gu-sel').value;

  rows = DATA.filter(d=>
    ((d.kind==='추천'&&showRec)||(d.kind==='회피'&&showAvo)) &&
    bizOn.has(d.biz) && (gu==='all'||d.gu===gu));

  rows.sort((a,b)=>{
    if(a.kind!==b.kind) return a.kind==='추천'?-1:1;
    if(sortKey==='gap') return (b.gap??0)-(a.gap??0);
    return (a.z??99)-(b.z??99);
  });

  overlays.forEach(o=>o.setMap(null)); overlays=[];
  const maxGap=Math.max(...rows.filter(r=>r.gap).map(r=>r.gap),1);

  rows.forEach((d,i)=>{
    const col = d.kind==='추천' ? '#f97316' : '#ef4444';
    const sz  = d.gap ? 13+Math.sqrt(d.gap/maxGap)*15 : 14;
    const el=document.createElement('div');
    el.className='mk-wrap';
    el.innerHTML = `<div class="mk-dot" style="width:${sz}px;height:${sz}px;background:${col}"></div>` +
                   (showLbl?`<div class="mk-name">${d.name}</div>`:'');
    el.onclick=()=>openPop(i);
    const ov=new kakao.maps.CustomOverlay(
      {position:new kakao.maps.LatLng(d.lat,d.lng),content:el,yAnchor:.5,clickable:true});
    ov.setMap(map); overlays.push(ov);
  });

  const rec=rows.filter(r=>r.kind==='추천'), avo=rows.filter(r=>r.kind==='회피');
  document.getElementById('hdr-stat').innerHTML=`추천 <b>${rec.length}</b> · 회피 <b>${avo.length}</b>`;
  document.getElementById('k-rec').textContent=rec.length;
  document.getElementById('k-avo').textContent=avo.length;
  document.getElementById('k-gap').textContent =
    rec.length ? won(rec.reduce((s,r)=>s+(r.gap||0),0)/rec.length) : '—';
  document.getElementById('k-pct').textContent =
    rec.length ? pctS(rec.reduce((s,r)=>s+(r.pct||0),0)/rec.length) : '—';
  document.getElementById('rank-label').textContent = `후보 순위 (${rows.length})`;

  document.getElementById('rank-list').innerHTML = rows.map((d,i)=>{
    const isR=d.kind==='추천';
    return `<div class="ri ${isR?'':'avo'} ${i===selIdx?'sel':''}" onclick="openPop(${i})">
      <span class="rno mono">${i+1}</span>
      <span class="rname">${d.name}<span class="rsub"> · ${d.biz}</span></span>
      <span class="rbadge">${d.gu}</span>
      <span class="rval ${isR?'':'rd'} mono">${isR?`하위 ${pctS(d.pct)}`:`폐업 ${d.closeRate}`}</span>
    </div>`;
  }).join('');
}

function openPop(i){
  selIdx=i; const d=rows[i];
  map.setCenter(new kakao.maps.LatLng(d.lat,d.lng));
  if(map.getLevel()>6) map.setLevel(5);
  document.getElementById('pop').innerHTML=popHtml(d);
  document.getElementById('pop-ov').classList.add('open');
  render();
}
function closePop(){document.getElementById('pop-ov').classList.remove('open')}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closePop()});

function popHtml(d){
  const isR=d.kind==='추천';
  const maxV=Math.max(d.actual||0,d.peer||0,d.model||0,1);
  const bar=(n,v,col,sub='')=>`
    <div class="cmp"><div class="cmp-l">
      <span class="cmp-n">${n}${sub?` <em>${sub}</em>`:''}</span>
      <span class="cmp-v mono" style="color:${col}">${won(v)}원</span></div>
      <div class="cmp-b"><i style="width:${v?(v/maxV*100):0}%;background:${col}"></i></div></div>`;

  const why = isR ? [
    `유사 조건 상권 <b>${d.peerN}곳</b> 중 <b>하위 ${pctS(d.pct)}</b> — 같은 업종 · ${d.se} · 60대 유동인구 규모 '${d.scale}' 기준`,
    `점포당 60대 매출이 유사 상권 중앙값의 <b>${d.peer?Math.round(d.actual/d.peer*100):'—'}%</b> 수준에 머문다`,
    `60대 매출 비중 <b>${(d.share60*100).toFixed(1)}%</b> — 서울 중앙값 이상으로 고객 기반이 이미 존재`,
    `경쟁 밀도와 폐업률 모두 업종 중앙값 이하 — 포화도·위험도 양쪽에서 여유`,
  ] : [
    `점포 밀도 <b>${d.density}</b>개/km² — 동일 업종 상위 25%로 <b>과밀</b>`,
    `폐업률 <b>${d.closeRate}</b> — 동일 업종 상위 25%로 <b>위험</b>`,
    `60대 고객 기반은 있으나(비중 ${(d.share60*100).toFixed(1)}%) 신규 진입 여지가 낮다`,
  ];

  const shap=SHAP_GLOBAL.map(s=>{
    const w=Math.abs(s.v)/0.5*50, pos=s.v>0;
    return `<div class="shp"><div class="shp-t">
      <span>${s.f}</span>
      <span class="mono" style="color:${pos?'#f97316':'#3b82f6'}">${pos?'+':''}${s.v.toFixed(2)}</span></div>
      <div class="shp-b"><div class="mid"></div>
        <i style="${pos?`left:50%;width:${w}%;background:#f97316`
                       :`right:50%;width:${w}%;background:#3b82f6`}"></i></div></div>`;
  }).join('');

  const kpi = isR ? `
    <div class="pk"><div class="pkv mono" style="color:var(--or)">${won(d.actual)}</div><div class="pkl">현재 60대 매출 (월)</div></div>
    <div class="pk"><div class="pkv mono" style="color:var(--gr)">${won(d.peer)}</div><div class="pkl">유사상권 중앙값</div></div>
    <div class="pk"><div class="pkv mono" style="color:var(--yl)">${won(d.gap)}</div><div class="pkl">미충족 규모 (월)</div></div>
    <div class="pk"><div class="pkv mono">${d.z}</div><div class="pkl">잔차 z-score</div></div>` : `
    <div class="pk"><div class="pkv mono" style="color:var(--rd)">${d.density}</div><div class="pkl">점포 밀도 /km²</div></div>
    <div class="pk"><div class="pkv mono" style="color:var(--rd)">${d.closeRate}</div><div class="pkl">폐업률</div></div>
    <div class="pk"><div class="pkv mono">${(d.share60*100).toFixed(1)}%</div><div class="pkl">60대 매출 비중</div></div>
    <div class="pk"><div class="pkv mono">${d.stores}</div><div class="pkl">현재 점포 수</div></div>`;

  return `
  <div class="pop-hdr">
    <div>
      <span class="pop-badge ${isR?'rec':'avo'}">${isR?'추천 · 미충족 수요':'회피 · 과밀/위험'}</span>
      <div class="pop-title">${d.name}</div>
      <div class="pop-meta"><b>${d.biz}</b> · ${d.gu} · ${d.se} · 현재 점포 ${d.stores}개
        ${isR?` · 모델 신뢰도 ${d.grade}`:''}</div>
    </div>
    <button class="pop-close" onclick="closePop()">×</button>
  </div>

  <div class="pop-kpi">${kpi}</div>

  <div class="psub">${isR?'왜 이 상권인가':'왜 피해야 하는가'}</div>
  <div class="pblk"><ul class="why ${isR?'':'avo'}">${why.map(w=>`<li>${w}</li>`).join('')}</ul></div>

  ${isR?`
  <div class="psub">점포당 월 60대 매출 비교</div>
  <div class="pblk">
    ${bar('현재 실적', d.actual, '#ef4444')}
    ${bar('유사 상권 중앙값', d.peer, '#22c55e', '실측 기준')}
    ${bar('회귀 모델 기대치', d.model, '#3d5070', '참고')}
    <div class="note">
      <b>실측 기준</b>이 유사 조건 상권들의 실제 관측 중앙값이므로 우선 참고한다.
      모델 기대치는 상권 조건으로 추정한 값이며 개별 점포의 운영 역량은 반영하지 않는다.<br>
      미충족 규모 <b>월 ${won(d.gap)}원</b> · 분기 ${won(d.gap*3)}원
    </div>
  </div>

  <div class="psub">회귀 분석 · 검증</div>
  <div class="pblk">
    <div class="pop-kpi" style="padding:0;margin-bottom:12px">
      <div class="pk"><div class="pkv mono" style="color:var(--or);font-size:15px">${d.z}</div><div class="pkl">잔차 z (업종 내)</div></div>
      <div class="pk"><div class="pkv mono" style="font-size:15px">${d.ratio}배</div><div class="pkl">실제 / 기대</div></div>
      <div class="pk"><div class="pkv mono" style="font-size:15px">${d.peerN}곳</div><div class="pkl">비교군 (${d.peerBasis})</div></div>
      <div class="pk"><div class="pkv" style="font-size:12px">${d.grade}</div><div class="pkl">업종별 설명력</div></div>
    </div>
    <div class="note">
      y = log(점포당 매출) − 업종 평균. 점포수는 분모로 처리하고 피처에서 제외해
      잔차가 <b>점포당 효율</b>이 아니라 <b>미충족 수요</b>를 가리키도록 했다.
      검증은 GroupKFold(상권 단위)로 상권 특성 누출을 차단했다.
    </div>
    <div style="margin-top:12px">
      <span class="bdg ok">✓ 기대매출 업종 중앙값 이상</span>
      <span class="bdg ok">✓ 잔차 z &lt; −1.0</span>
      <span class="bdg ok">✓ 60대 비중 중앙값 이상</span>
      <span class="bdg ok">✓ 경쟁밀도 하위</span>
      <span class="bdg ok">✓ 폐업률 하위</span>
      <span class="bdg ok">✓ 유사상권 하위 20% 이내</span>
      ${d.grade==='참고(설명력 제한적)'?`<span class="bdg warn">⚠ 모델 설명력 제한 — 현장 확인 필요</span>`:''}
    </div>
  </div>

  <div class="psub">SHAP — 매출에 영향을 준 요인</div>
  <div class="pblk">${shap}
    <div class="note">전역 기여도(모델 전체 평균). 업종 효과는 y 중심화로 제거되어
      순수 상권 조건의 기여만 표시된다.</div>
  </div>`:''}

  <div class="psub">상권 특성</div>
  <div class="pblk">
    <div class="pop-kpi" style="padding:0">
      <div class="pk"><div class="pkv mono" style="font-size:15px">${d.flow60?d.flow60.toLocaleString():'—'}</div><div class="pkl">60대 유동인구</div></div>
      <div class="pk"><div class="pkv mono" style="font-size:15px">${d.resid60?d.resid60.toLocaleString():'—'}</div><div class="pkl">60대 상주인구</div></div>
      <div class="pk"><div class="pkv mono" style="font-size:15px">${d.facil??'—'}</div><div class="pkl">집객시설</div></div>
      <div class="pk"><div class="pkv mono" style="font-size:15px">${d.subway??0}</div><div class="pkl">지하철역</div></div>
    </div>
  </div>

  <!-- ══════ 임대료 — 작성 예정 ══════ -->
  <div class="psub">상권 평균 임대료</div>
  <div class="pblk">
    <div class="blank">
      <div class="bt">작성 예정</div>
      <div class="bs">임대료·보증금은 본 분석 데이터에 포함되지 않는다.<br>
        별도 출처를 확보해 이 영역을 채울 것.</div>
      <div class="rows">
        <div class="r"><span>㎡당 월 임대료</span><span>— — —</span></div>
        <div class="r"><span>보증금 (평균)</span><span>— — —</span></div>
        <div class="r"><span>권리금 (평균)</span><span>— — —</span></div>
        <div class="r"><span>자본 1억 대비 진입 가능성</span><span>— — —</span></div>
      </div>
    </div>
  </div>

  <div class="psub">한계</div>
  <div class="pblk" style="padding-bottom:24px">
    <div class="note" style="margin-top:0">
      본 결과는 <b>확정 추천이 아니라 현장 실사 우선순위</b>다.
      추정매출은 카드 결제 기반이라 현금 비중이 높은 60대 매출은 과소 추정될 수 있으며,
      상권 단위 집계이므로 개별 점포의 성패는 설명하지 못한다.
      임대료·인건비 등 비용이 반영되지 않은 <b>매출 기준</b> 분석이다.
    </div>
  </div>`;
}

render();
</script>
</body>
</html>
